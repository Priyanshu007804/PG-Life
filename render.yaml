services:
  - type: web
    name: pglife-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.php
    envVars:
      # Set these in Render Dashboard (or via Blueprint) to point to your cloud MySQL instance:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
        value: "3306"
      - key: DB_SSL
        sync: false
        value: "true"
